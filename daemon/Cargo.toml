[package]
name = "takt"
version = "0.1.0"
edition = "2021"
description = "Takt — Music Assistant client daemon for LG webOS TVs"
publish = false

[[bin]]
name = "takt"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.104"
axum = "=0.8.9"
futures-util = "=0.3.34"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
syncspin-client = { git = "https://github.com/acuntex/syncspin", rev = "dd5cf9e2a1c5957f7f5746cb9a0138be34ec9b01", features = ["mdns", "artwork", "color"] }
tokio = { version = "=1.54.1", features = ["macros", "net", "time", "rt-multi-thread", "process", "io-util", "sync"] }

[dev-dependencies]
base64 = "=0.23.1"
http-body-util = "=0.1.5"
tower = { version = "=0.5.3", features = ["util"] }
